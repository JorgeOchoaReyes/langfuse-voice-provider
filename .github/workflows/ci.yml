name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets a run be started by hand against any ref — needed whenever a commit
  # lands without a run attached to it, such as pushes made while Actions was
  # still disabled on the repository.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.11", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
